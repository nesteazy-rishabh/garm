[project]
name = "garm-bench"
version = "0.1.0.dev0"
description = "Cross-run prompt injection in scheduled agents, and what each defence costs in human approvals."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Rishabh Singh" }]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic", "python-dotenv"]
inspect = ["inspect-ai"]
figures = ["matplotlib>=3.9"]

[project.scripts]
garm = "garm_bench.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garm_bench"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
